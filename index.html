<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="theme-color" content="#0F3D2E">
<title>戰報</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    color-scheme: light;
    /* 象牙麻將牌配色（亮色模式）－ 靈感來自牌面本身：象牙底、墨色字、萬/索/筒三色印墨 */
    --felt:      #0F3D2E;
    --felt-mid:  #16543F;
    --tile:      #F6F1E3;
    --tile-2:    #EDE6D2;
    --ink:       #1E1C16;
    --ink-soft:  #6E6656;
    --line:      #DED4B8;
    --on-felt:   #F8F4E7; /* 固定淺色：專供疊在深綠色（--felt/--felt-mid）上的文字使用，不隨深淺模式改變 */
    /* 💡 這四色是「對卡片背景」專門優化過的版本，對比度都拉到 6.0 以上（先前是亮暗共用一組、
       卡片對比度只有約 3.1，這次分開優化後清楚很多）。深色模式另有專屬版本，見下方。 */
    --wan:       #962525; /* 萬｜紅 */
    --suo:       #046314; /* 索｜綠 */
    --tong:      #255296; /* 筒｜藍 */
    --gold:      #6D5005; /* 莊｜金 */
    --shadow: 0 1px 2px rgba(30,28,22,.08), 0 4px 14px rgba(30,28,22,.06);
  }
  [data-scheme="dark"]{
    color-scheme: dark;
    --felt:      #0A2A1F;
    --felt-mid:  #123A2B;
    --tile:      #14261D;
    --tile-2:    #1B3226;
    --ink:       #F3EEDD;
    --ink-soft:  #9FB3A6;
    --line:      #2A4234;
    --wan:       #DD9B9B;
    --suo:       #82BA8B;
    --tong:      #97B1D8;
    --gold:      #BFAF85;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--felt);
    color:var(--on-felt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
    min-height:100vh;
    padding-bottom:36px;
  }
  .num{font-family:"SF Mono","Roboto Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}

  /* ---------- 頂部 ---------- */
  header.hero{
    background:linear-gradient(180deg, var(--felt) 0%, var(--felt-mid) 100%);
    color:var(--on-felt);
    padding:18px 16px 22px;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  header.hero .eyebrow{font-size:13px; opacity:.7; letter-spacing:.02em;}
  header.hero h1{margin:2px 0 0; font-size:22px; font-weight:700;}
  header.hero .progress{margin-top:6px; font-size:14px; opacity:.85;}
  header.hero .badge{
    display:inline-block; margin-top:8px; padding:3px 10px; border-radius:20px;
    background:rgba(255,255,255,.12); font-size:12px;
  }
  .trim-note{margin-top:8px; font-size:12px; opacity:.75; line-height:1.5;}

  /* ---------- 玩家總覽（麻將牌造型頭像） ---------- */
  .players{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:14px 16px 4px;
  }
  .p-card{
    background:var(--tile); color:var(--ink); border-radius:14px; padding:12px; box-shadow:var(--shadow);
    border:1px solid var(--line); cursor:pointer; position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .p-card.active{outline:2px solid var(--accent); outline-offset:-2px;}
  .p-card:active{transform:scale(.98);}
  .p-tile{
    width:34px; height:44px; border-radius:6px; background:var(--tile-2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:700; color:var(--accent); margin-bottom:8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
  }
  .p-name{font-size:14px; font-weight:600; display:flex; align-items:center; gap:4px;}
  .p-name .me-mark{font-size:11px; color:var(--ink-soft); font-weight:400;}
  .p-rank{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .p-money{font-size:19px; font-weight:700; margin-top:6px;}
  .p-sub{font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.5;}

  /* ---------- Tab ---------- */
  .tabbar{
    display:flex; gap:8px; padding:14px 16px 10px;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    scrollbar-width:none; /* Firefox */
  }
  .tabbar::-webkit-scrollbar{ display:none; } /* Chrome / Telegram WebView */
  .tabbar button{
    appearance:none; border:1.5px solid var(--line); background:var(--tile);
    color:var(--ink); padding:9px 16px; border-radius:20px; font-size:13px;
    font-weight:600; white-space:nowrap; flex:0 0 auto; scroll-snap-align:start;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .tabbar button:active{ transform:scale(.96); }
  .tabbar button.active{
    background:var(--gold); color:#1E1608; border-color:var(--gold);
    box-shadow:0 2px 8px rgba(184,134,11,.35);
  }
  .jiang-tabbar{
    display:flex; gap:6px; margin-bottom:10px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .jiang-tabbar::-webkit-scrollbar{ display:none; }
  .jiang-tabbar button{
    appearance:none; border:1.5px solid var(--line); background:var(--tile-2);
    color:var(--ink); padding:6px 12px; border-radius:16px; font-size:12px;
    font-weight:600; white-space:nowrap; flex:0 0 auto;
  }
  .jiang-tabbar button.active{ background:var(--gold); color:#1E1608; border-color:var(--gold); font-weight:700; }

  section.panel{ padding:14px 16px 8px; display:none; }
  section.panel.active{display:block;}

  .card{
    background:var(--tile); color:var(--ink); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 10px; font-size:14px; font-weight:700; display:flex; justify-content:space-between; align-items:baseline;}
  .card h3 .h-money{font-size:14px;}
  .card h3 .h-money.plus{color:var(--suo);}
  .card h3 .h-money.minus{color:var(--wan);}

  /* 統計細項：盈／虧分類用邊框與底色明顯區分 */
  .card.stat-gain{ border-left:4px solid var(--suo); }
  .card.stat-loss{ border-left:4px solid var(--wan); background:var(--tile-2); opacity:.92; }
  [data-scheme="dark"] .card.stat-loss{ opacity:.85; }

  /* 明細 */
  .circle-header{
    font-size:12px; font-weight:700; color:var(--on-felt); background:var(--felt-mid);
    display:inline-block; padding:4px 10px; border-radius:8px; margin:14px 0 8px;
  }
  .circle-header:first-child{margin-top:0;}
  .hand-row{
    display:flex; justify-content:space-between; gap:8px; padding:9px 10px;
    border-radius:10px; margin-bottom:6px; font-size:13.5px; line-height:1.45;
    border-left:3px solid transparent;
  }
  .hand-row.involved{background:var(--tile-2); border-left-color:var(--accent-row); font-weight:600; color:var(--ink);}
  .hand-row.bystander{background:var(--tile); color:var(--ink-soft); font-style:italic;}
  .hand-row .who{flex:1;}
  .hand-row .amt{white-space:nowrap;}
  .amt.plus{color:var(--suo);}
  .amt.minus{color:var(--wan);}
  .ctx-tag{
    display:inline-block; margin-left:6px; font-size:11px; padding:1px 6px;
    border-radius:8px; background:rgba(184,134,11,.18); color:var(--gold);
  }

  /* 統計 */
  .stat-sub{
    display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0;
    border-top:1px dashed var(--line); color:var(--ink-soft);
  }
  .stat-sub:first-of-type{border-top:none;}
  .stat-sub .amt{color:var(--ink); font-weight:600;}
  .stat-sub .amt.plus{color:var(--suo);}
  .stat-sub .amt.minus{color:var(--wan);}

  /* chart */
  .chart-wrap{position:relative; height:280px;}
  .chart-scroll{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:4px;
  }
  .chart-scroll .chart-wrap{ height:280px; }
  .legend-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12px;}
  .legend-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px;}

  .empty{
    background:var(--tile); border:1px solid var(--line); border-radius:14px;
    color:var(--ink-soft); font-size:13px; text-align:center; padding:24px 0;
  }
  footer.note{padding:18px 16px 6px; font-size:11.5px; color:rgba(246,241,227,.55); text-align:center;}

  /* ---------- 即時模式：設定精靈 ---------- */
  .wiz-step{ margin-bottom:14px; }
  .wiz-label{ font-size:13px; font-weight:700; color:var(--on-felt); margin-bottom:8px; }
  .wiz-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .wiz-btn{
    appearance:none; border:1.5px solid var(--line); background:var(--tile);
    color:var(--ink); padding:12px; border-radius:12px; font-size:14px; font-weight:600;
    text-align:center;
  }
  .wiz-btn.active{ background:var(--gold); color:#1E1608; border-color:var(--gold); }
  .wiz-input{
    width:100%; box-sizing:border-box; padding:12px 14px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--tile); color:var(--ink);
    font-size:15px; margin-bottom:8px;
  }
  .wiz-input::placeholder{ color:var(--ink-soft); }
  .wiz-primary-btn{
    width:100%; appearance:none; border:none; background:var(--felt-mid); color:var(--on-felt);
    padding:13px; border-radius:12px; font-size:15px; font-weight:700; margin-top:6px;
  }
  .wiz-primary-btn:disabled{ opacity:.4; }
  .wiz-secondary-btn{
    width:100%; appearance:none; border:1.5px solid var(--line); background:transparent;
    color:var(--on-felt); padding:11px; border-radius:12px; font-size:13px; font-weight:600; margin-top:8px;
  }
  .wiz-textarea{
    width:100%; box-sizing:border-box; min-height:120px; padding:12px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--tile); color:var(--ink); font-size:13px;
    font-family:inherit; margin-bottom:8px;
  }
  .wiz-error{ color:var(--wan); font-size:12.5px; margin:4px 0 8px; }

  /* ---------- 即時模式：記分表單 ---------- */
  .form-section-title{
    font-size:12px; font-weight:700; color:var(--on-felt); background:var(--felt-mid);
    display:inline-block; padding:4px 10px; border-radius:8px; margin:14px 0 8px;
  }
  .form-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .form-pbtn{
    appearance:none; border:1.5px solid var(--line); background:var(--tile);
    color:var(--ink); padding:11px 8px; border-radius:12px; font-size:13px; font-weight:600;
  }
  .form-pbtn.selected{ background:var(--suo); color:#fff; border-color:var(--suo); }
  .form-pbtn.disabled{ opacity:.35; }
  .form-wide-btn{
    width:100%; appearance:none; border:1.5px solid var(--line); background:var(--tile-2);
    color:var(--ink); padding:10px; border-radius:12px; font-size:13px; font-weight:600; margin-bottom:6px;
  }
  .form-wide-btn.selected{ background:var(--gold); color:#1E1608; border-color:var(--gold); }
  .form-tai-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:6px; }
  .form-tai-btn{
    appearance:none; border:1.5px solid var(--line); background:var(--tile);
    color:var(--ink); padding:9px 0; border-radius:10px; font-size:13px; font-weight:600;
  }
  .form-tai-btn.selected{ background:var(--suo); color:#fff; border-color:var(--suo); }
  .form-hint-card{
    background:var(--tile); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:12px; box-shadow:var(--shadow); font-size:13px; color:var(--ink);
  }
  .form-round-info{
    font-size:12.5px; font-weight:700; color:var(--on-felt); background:var(--felt-mid);
    border-radius:10px; padding:8px 12px; margin-bottom:10px; text-align:center;
  }
  .live-toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(8px);
    background:rgba(30,22,8,.94); color:#F6F1E3; padding:10px 20px; border-radius:999px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none; white-space:nowrap;
    transition:opacity .28s ease, transform .28s ease; z-index:999;
    box-shadow:0 8px 20px rgba(0,0,0,.28);
  }
  .live-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .form-sys-row{ display:flex; gap:8px; margin-top:10px; }
  .form-sys-row button{
    flex:1; appearance:none; border:1.5px solid var(--line); background:var(--tile-2);
    color:var(--ink); padding:10px; border-radius:12px; font-size:12.5px; font-weight:600;
  }
  .savecode-box{
    background:var(--tile-2); border:1px dashed var(--line); border-radius:10px;
    padding:10px; font-size:11px; word-break:break-all; color:var(--ink-soft); margin:8px 0;
    max-height:80px; overflow-y:auto;
  }
</style>
</head>
<body>

<!-- ============================================================
     即時計分模式：設定精靈 + 記分表單（沒有 ?d= 網址參數時顯示）
     ============================================================ -->
<div id="live-view" style="display:none;">
  <header class="hero">
    <div class="eyebrow">麻將計分 · 即時模式</div>
    <h1 id="live-title">設定新局</h1>
    <div class="progress" id="live-progress"></div>
  </header>

  <div id="live-toast" class="live-toast"></div>

  <div id="setup-wizard" style="padding:16px;"></div>

  <div id="scoring-app" style="display:none;">
    <div class="players" id="live-players"></div>
    <div id="live-form-wrap" style="padding:0 16px 14px;"></div>
    <div class="tabbar" id="live-tabbar">
      <button data-live-tab="score" class="active">🀄 記分</button>
      <button data-live-tab="report">📊 戰報</button>
    </div>
    <div id="live-score-panel"></div>
    <div id="live-report-panel" style="display:none;"></div>
  </div>
</div>

<!-- ============================================================
     戰報檢視模式：既有內容（網址帶 ?d= 時顯示，或即時模式點「戰報」分頁時借用）
     ============================================================ -->
<div id="report-view">

<header class="hero">
  <div class="eyebrow">麻將戰報 · Mahjong Report</div>
  <h1 id="h-title">讀取中…</h1>
  <div class="progress" id="h-progress"></div>
  <span class="badge" id="h-badge"></span>
  <div class="trim-note" id="h-trim" style="display:none;"></div>
</header>

<div class="players" id="players"></div>

<div class="tabbar" id="tabbar">
  <button data-tab="hist" class="active">📜 每局明細</button>
  <button data-tab="stat">📊 統計細項</button>
  <button data-tab="trend">📉 盈虧走勢</button>
  <button data-tab="analysis">🥧 來源分析</button>
</div>

<section class="panel active" id="panel-hist"></section>
<section class="panel" id="panel-stat"></section>
<section class="panel" id="panel-trend">
  <div class="jiang-tabbar" id="jiang-tabbar" style="display:none;"></div>
  <div class="card">
    <h3 id="trend-title">盈虧走勢圖</h3>
    <div class="chart-scroll"><div class="chart-wrap" id="trend-chart-wrap"><canvas id="chart-trend"></canvas></div></div>
    <div class="legend-row" id="trend-legend"></div>
  </div>
</section>
<section class="panel" id="panel-analysis"></section>

</div>

<footer class="note">資料僅存在於這個網址本身，不會上傳到任何伺服器</footer>

<script>
/* ============================================================
   1. 讀取 Telegram WebApp 與資料
   ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const scheme = (tg && tg.colorScheme) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-scheme', scheme);
if (tg) {
  try { tg.setHeaderColor(scheme === 'dark' ? '#0A2A1F' : '#0F3D2E'); } catch(e){}
  try { tg.setBackgroundColor(scheme === 'dark' ? '#0A2A1F' : '#0F3D2E'); } catch(e){}
}

// 💡 與 CSS 的 --wan/--suo/--tong/--gold 保持一致：這組是針對卡片背景（象牙白／深卡其）
//    專門優化過的高對比版本，亮／暗模式各自一組，對比度都在 6.0 以上。
const SUIT_COLORS = ['#962525', '#046314', '#255296', '#6D5005'];
const SUIT_COLORS_DARK = ['#DD9B9B', '#82BA8B', '#97B1D8', '#BFAF85'];
const suitColor = (i) => (scheme === 'dark' ? SUIT_COLORS_DARK : SUIT_COLORS)[i];
const WINDS = ['東','南','西','北'];
const PRESET_NAMES = ["把拔", "馬麻", "姑姑", "大葛格", "小葛格", "哲弘", "鈺蒨", "鈺靜", "宜瑄", "威琛", "沛妤", "鎧欣", "毓智", "采瑞", "泰民"];
const SHANTEN_NAMES = {'0': '聽牌', '1': '1進聽', 'away': '走遠了', 'notready': '沒聽牌'};
const TYPE_RON = 0, TYPE_TSUMO = 1, TYPE_DRAW = 2;

function b64urlToBytes(b64url){
  let b64 = b64url.replace(/-/g,'+').replace(/_/g,'/');
  while (b64.length % 4) b64 += '=';
  const raw = atob(b64);
  const arr = new Uint8Array(raw.length);
  for (let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function loadPayload(){
  const params = new URLSearchParams(window.location.search);
  const d = params.get('d');
  if (!d) return null;
  try {
    const bytes = b64urlToBytes(d);
    const json = window.pako.inflate(bytes, {to: 'string'});
    return JSON.parse(json);
  } catch(e) {
    console.error('資料解析失敗', e);
    return null;
  }
}

let DATA = loadPayload();

/* ============================================================
   2. 核心算錢公式（與 Python compute_round_deltas 完全一致）
      規則：只有自摸會自動疊加莊家連莊台；胡／放槍照玩家喊的台數算。
   ============================================================ */
function computeDeltas(rec, base, taiScore){
  const deltas = [0,0,0,0];
  if (rec.type === TYPE_DRAW) return deltas;
  const w = rec.winner, tai = rec.tai, d = rec.dealer, streak = rec.streak;

  if (rec.type === TYPE_TSUMO){
    for (let seat=0; seat<4; seat++){
      if (seat === w) continue;
      const extra = (w === d) ? 0 : ((seat === d) ? (1 + 2*streak) : 0);
      const amt = base + (tai + extra) * taiScore;
      deltas[w] += amt;
      deltas[seat] -= amt;
    }
  } else { // ron
    const amt = base + tai * taiScore;
    deltas[w] += amt;
    deltas[rec.loser] -= amt;
  }
  return deltas;
}

function rowsToRecords(rows){
  return rows.map(r => ({
    jiang: r[0], circle: r[1], dealer: r[2], streak: r[3], type: r[4],
    winner: r[5], loser: r[6], tai: r[7], shanten: r[8],
  }));
}

let RECORDS = DATA ? rowsToRecords(DATA.r) : [];
let BASE = DATA ? DATA.base : 0;
let TAI_SCORE = DATA ? DATA.tai : 0;
let NAMES = DATA ? DATA.names : ['東','南','西','北'];

let viewSeat = DATA ? DATA.my : 0;

/* ============================================================
   3. 畫面渲染
   ============================================================ */
function fmtSigned(n){
  return (n>0? '+':'') + n.toLocaleString('zh-Hant');
}
function relName(seat){
  if (seat === viewSeat) return '我';
  const diff = (seat - viewSeat + 4) % 4;
  return diff===1? '下家' : diff===2? '對家' : '上家';
}

function renderHeader(){
  if (!DATA){
    document.getElementById('h-title').textContent = '找不到戰報資料';
    document.getElementById('h-progress').textContent = '請從 Bot 重新開啟這個網頁';
    return;
  }
  document.getElementById('h-title').textContent = `${NAMES[viewSeat]}(${WINDS[viewSeat]}) 的戰報`;
  document.getElementById('h-progress').textContent = `共打了 ${DATA.tr} 局・進度：${DATA.prog}`;
  const badge = document.getElementById('h-badge');

/* ---------- 明細 tab ---------- */
function buildHandLine(rec, viewer){
  const dName = NAMES[rec.dealer];
  let prefix = (rec.dealer === viewer ? '👑 ' : '👤 ') + dName + '上莊';
  if (rec.streak > 0) prefix += ` 連${rec.streak}`;

  let body = '', involved = false, amtClass = '', amtText = '';

  if (rec.type === TYPE_DRAW){
    body = '💨 臭連';
  } else {
    const deltas = computeDeltas(rec, BASE, TAI_SCORE);
    if (rec.type === TYPE_TSUMO){
      involved = true;
      const w = rec.winner;
      const wLabel = NAMES[w] + (w===viewer? '(我)':'');
      if (viewer === w){
        body = `🌟 ${wLabel} 自摸 ${rec.tai}台`;
        amtClass='plus'; amtText = fmtSigned(deltas[w]);
      } else {
        body = `🌟 ${NAMES[w]} 自摸 ${rec.tai}台`;
        amtClass='minus'; amtText = fmtSigned(deltas[viewer]);
      }
    } else {
      const w = rec.winner, l = rec.loser;
      const deltas = computeDeltas(rec, BASE, TAI_SCORE);
      const amt = BASE + rec.tai * TAI_SCORE;
      const wLabel = NAMES[w] + (w===viewer? '(我)':'');
      const lLabel = NAMES[l] + (l===viewer? '(我)':'');
      body = `🀄 ${wLabel} 胡 ${lLabel} ${rec.tai}台`;
      if (viewer === w){ involved=true; amtClass='plus'; amtText = '+'+amt; }
      else if (viewer === l){
        involved=true; amtClass='minus'; amtText = '-'+amt;
        if (viewer === DATA.my && DATA.track && rec.shanten){
          body += `<span class="ctx-tag">${SHANTEN_NAMES[rec.shanten]||''}</span>`;
        }
      }
      else { amtText = amt; }
    }
  }
  return {prefix, body, involved, amtClass, amtText};
}

function renderHist(){
  const el = document.getElementById('panel-hist');
  el.innerHTML = '';
  if (!DATA || RECORDS.length===0){ el.innerHTML = '<div class="empty">目前還沒有任何局數紀錄</div>'; return; }

  let lastHeader = null;
  RECORDS.forEach(rec => {
    const key = rec.jiang + '-' + rec.circle;
    if (key !== lastHeader){
      const jiangStr = rec.jiang>0 ? `第${rec.jiang+1}將 ` : '';
      const h = document.createElement('div');
      h.className = 'circle-header';
      h.textContent = `${jiangStr}${WINDS[rec.circle]}風圈`;
      el.appendChild(h);
      lastHeader = key;
    }
    const {prefix, body, involved, amtClass, amtText} = buildHandLine(rec, viewSeat);
    const row = document.createElement('div');
    row.className = 'hand-row ' + (involved? 'involved':'bystander');
    if (involved){
      const colorSeat = (rec.type === TYPE_DRAW) ? viewSeat
        : (viewSeat === rec.winner ? viewSeat : rec.dealer);
      row.style.setProperty('--accent-row', suitColor(colorSeat));
    }
    row.innerHTML = `<div class="who">${prefix}　${body}</div><div class="amt num ${amtClass}">${amtText? '('+amtText+'元)':''}</div>`;
    el.appendChild(row);
  });
}

/* ---------- 統計 tab ---------- */
function renderStat(){
  const el = document.getElementById('panel-stat');
  el.innerHTML = '';
  if (!DATA) return;

  const buckets = {sd:[], win:[], dealin:[], sd_other:[]};
  RECORDS.forEach(rec => {
    if (rec.type === TYPE_DRAW) return;
    const deltas = computeDeltas(rec, BASE, TAI_SCORE);
    if (rec.type === TYPE_TSUMO){
      if (rec.winner === viewSeat) buckets.sd.push({tai:rec.tai, money:deltas[viewSeat]});
      else buckets.sd_other.push({tai:rec.tai, money:deltas[viewSeat]});
    } else {
      if (rec.winner === viewSeat) buckets.win.push({tai:rec.tai, money:deltas[viewSeat]});
      else if (rec.loser === viewSeat){
        const ctx = (viewSeat===DATA.my && DATA.track && rec.shanten) ? (SHANTEN_NAMES[rec.shanten]||'') : '';
        buckets.dealin.push({tai:rec.tai, money:deltas[viewSeat], ctx});
      }
    }
  });

  const cfg = [
    ['🌟 自摸', buckets.sd, 'gain'], ['🀄 胡牌', buckets.win, 'gain'],
    ['💸 放槍', buckets.dealin, 'loss'], ['💥 被摸', buckets.sd_other, 'loss'],
  ];
  cfg.forEach(([label, list, kind]) => {
    const total = list.reduce((s,r)=>s+r.money,0);
    const card = document.createElement('div');
    card.className = `card stat-${kind}`;
    let subHtml = list.map(r => {
      const cls = r.money > 0 ? 'plus' : (r.money < 0 ? 'minus' : '');
      return `<div class="stat-sub"><span>${r.tai}台${r.ctx? ' · '+r.ctx:''}</span><span class="amt num ${cls}">${fmtSigned(r.money)}元</span></div>`;
    }).join('');
    if (!subHtml) subHtml = '<div class="stat-sub"><span>尚無紀錄</span><span></span></div>';
    const totalCls = total > 0 ? 'plus' : (total < 0 ? 'minus' : '');
    card.innerHTML = `<h3>${label} ${list.length} 次<span class="h-money num ${totalCls}">${fmtSigned(total)}元</span></h3>${subHtml}`;
    el.appendChild(card);
  });
}

function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
let trendChart = null;
let selectedJiang = 'all'; // 'all' 或 0-indexed 將數

function renderJiangTabs(){

function renderTrend(){
  if (!DATA) return;
  renderJiangTabs();

  // 💡 標籤跟四家數值一律直接用伺服器算好、已驗證正確的結果，網頁端完全不組資料、不做計算，
  //    只負責把拿到的東西畫出來——徹底排除「客戶端邏輯兜不起來」的可能性。
  //    每一圈只有「第一個點」有文字（東／南／西／北，「全部」視角東圈會加「第N將」），
  //    其餘點留空字串，這樣座標軸永遠乾淨、不需要縮寫或省略判斷，也不會被繪圖套件自己藏字。
  const key = selectedJiang === 'all' ? null : String(selectedJiang);
  const bundle = key ? DATA.trendByJiang[key] : DATA.trendAll;
  const titleSuffix = key ? `（第${selectedJiang+1}將）` : '（全部）';

  document.getElementById('trend-title').textContent = '盈虧走勢圖' + titleSuffix;

  const labels = bundle.labels;
  const datasets = [0,1,2,3].map(i => ({
    label: NAMES[i],
    data: bundle.series[i],
    borderColor: suitColor(i),
    backgroundColor: suitColor(i),
    tension: .25, pointRadius: 3, borderWidth: 2.5,
  }));

  // 💡 起始籌碼參考線：不管 Y 軸自動縮放到多緊，都清楚看得出「大家從這個數字開始」，
  //    比照原生 Telegram 圖片版的做法（那邊也有畫一條起始籌碼虛線）。
  datasets.push({
    label: '起始籌碼',
    data: labels.map(() => DATA.chips),
    borderColor: 'rgba(128,128,128,.55)',
    backgroundColor: 'rgba(128,128,128,.55)',
    borderDash: [6,4],
    pointRadius: 0,
    borderWidth: 1.5,
    tension: 0,
  });

  // 💡 明確指定 Y 軸範圍（比照原生圖片版 ax.set_ylim 的做法），不要依賴繪圖套件自己決定，
  //    否則籌碼數字（例如 30000）容易被縮放邏輯拉到緊貼頂端甚至誤判成要從 0 開始畫。
  const allValues = [0,1,2,3].flatMap(i => bundle.series[i]);
  const minY = Math.min(...allValues, DATA.chips);
  const maxY = Math.max(...allValues, DATA.chips);
  const yRange = maxY - minY;
  const yPadding = yRange > 0 ? yRange * 0.12 : Math.max(1000, DATA.chips * 0.05);

  const ctx = document.getElementById('chart-trend');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {labels, datasets},
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{
          ticks:{
            color:cssVar('--ink-soft'), font:{size:11},
            autoSkip:false, maxRotation:0, minRotation:0,
          },
          grid:{display:false}
        },
        y:{
          min: minY - yPadding,
          max: maxY + yPadding,
          ticks:{
            color:cssVar('--ink-soft'), font:{size:11},
            callback:(v)=>v.toLocaleString('zh-Hant'),
          },
          grid:{color:'rgba(128,128,128,.15)'}
        },
      }
    }
  });

  const legend = document.getElementById('trend-legend');
  legend.innerHTML = [0,1,2,3].map(i=>
    `<span><span class="legend-dot" style="background:${suitColor(i)}"></span>${NAMES[i]}</span>`
  ).join('') + `<span><span class="legend-dot" style="background:rgba(128,128,128,.55)"></span>起始籌碼</span>`;
}

let pieCharts = [];
function renderAnalysis(){
  const el = document.getElementById('panel-analysis');
  el.innerHTML = '';
  pieCharts.forEach(c=>c.destroy()); pieCharts = [];
  if (!DATA) return;

  const winCounts=[0,0,0,0], dealinCounts=[0,0,0,0], sdCounts=[0,0,0,0];
  const winMoney=[0,0,0,0], dealinMoney=[0,0,0,0], sdMoney=[0,0,0,0];
  let draws=0;
  RECORDS.forEach(rec=>{
    if (rec.type===TYPE_DRAW){ draws++; return; }
    const deltas = computeDeltas(rec, BASE, TAI_SCORE);
    if (rec.type===TYPE_RON){
      winCounts[rec.winner]++; winMoney[rec.winner]+=deltas[rec.winner];
      dealinCounts[rec.loser]++; dealinMoney[rec.loser]+=deltas[rec.loser];
    } else {
      sdCounts[rec.winner]++; sdMoney[rec.winner]+=deltas[rec.winner];
    }
  });
  const tr = DATA.tr || RECORDS.length;

  // 💡 長條圖：各家在三種事件上的次數比較，跟甜甜圈圖互補（甜甜圈看單一事件的組成，長條圖看跨事件的比較）
  const barCard = document.createElement('div');
  barCard.className = 'card';
  barCard.innerHTML = '<h3>📊 各家次數比較</h3><div class="chart-wrap" style="height:240px;"><canvas id="bar-compare"></canvas></div>';
  el.appendChild(barCard);
  const barChart = new Chart(document.getElementById('bar-compare'), {
    type:'bar',
    data:{
      labels: NAMES,
      datasets:[
        {label:'胡牌', data:winCounts, backgroundColor:suitColor(1)},
        {label:'放槍', data:dealinCounts, backgroundColor:suitColor(0)},
        {label:'自摸', data:sdCounts, backgroundColor:suitColor(3)},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'top', labels:{ color:cssVar('--ink'), font:{size:12} } } },
      scales:{
        x:{ ticks:{color:cssVar('--ink'), font:{size:12}}, grid:{display:false} },
        y:{ beginAtZero:true, ticks:{color:cssVar('--ink-soft'), stepSize:1, font:{size:11}}, grid:{color:'rgba(128,128,128,.15)'} },
      }
    }
  });
  pieCharts.push(barChart); // 沿用同一個銷毀清單，切分頁重繪時一併清掉

  function makeCard(title, counts, moneys, extras, actionLabel){
    const card = document.createElement('div');
    card.className='card';
    const canvasId = 'pie-'+title;
    card.innerHTML = `<h3>${title}</h3><div class="chart-wrap" style="height:220px;"><canvas id="${canvasId}"></canvas></div>`;
    el.appendChild(card);

    const grayScheme = (scheme === 'dark') ? ['#C9C3B4', '#D6D1C4'] : ['#4A453A', '#3D392F'];
    const extraColors = grayScheme; // 💡 額外分類（例如自摸／臭連）各用不同灰階色，避免跟四家顏色搶戲又能互相區分，對比度同樣拉到 6.0 以上
    const labels = NAMES.slice();
    const data = counts.slice();
    const colors = [0,1,2,3].map(suitColor);
    extras.forEach((ex, idx) => {
      if (ex.count > 0){
        labels.push(ex.label); data.push(ex.count); colors.push(extraColors[idx % extraColors.length]);
      }
    });

    const chart = new Chart(document.getElementById(canvasId), {
      type:'doughnut',
      data:{labels, datasets:[{data, backgroundColor:colors, borderWidth:0}]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
    });
    pieCharts.push(chart);

    // 💡 比照原本 Telegram 內建圖表：名字＋次數＋百分比＋金額
    const rows = [];
    [0,1,2,3].forEach(i=>{
      if (counts[i] > 0){
        const pct = (counts[i]/tr*100).toFixed(1);
        rows.push({label:`${NAMES[i]}：${actionLabel} ${counts[i]} 次 (${pct}%)`, money:moneys[i], color:suitColor(i)});
      }
    });
    extras.forEach((ex, idx) => {
      if (ex.count > 0){
        const pct = (ex.count/tr*100).toFixed(1);
        rows.push({label:`${ex.label}：${ex.count} 次 (${pct}%)`, money:null, color:extraColors[idx % extraColors.length]});
      }
    });
    const detail = document.createElement('div');
    detail.className = 'legend-row';
    detail.style.flexDirection = 'column';
    detail.style.gap = '6px';
    detail.innerHTML = rows.map(r =>
      `<div style="display:flex;justify-content:space-between;width:100%;">
         <span><span class="legend-dot" style="background:${r.color}"></span>${r.label}</span>
         ${r.money!==null? `<span class="num" style="font-weight:600;">${fmtSigned(r.money)}元</span>`:''}
       </div>`
    ).join('');
    card.appendChild(detail);
  }

  const totalSd = sdCounts.reduce((a,b)=>a+b,0);
  const totalWin = winCounts.reduce((a,b)=>a+b,0);
  // 💡 「自摸」「臭連」「胡牌」都各自拆成獨立分類，不再合併成單一「自摸/臭連」這種模糊區塊
  makeCard('🀄 胡牌來源', winCounts, winMoney, [{label:'自摸', count:totalSd}, {label:'臭連', count:draws}], '胡');
  makeCard('💸 放槍去向', dealinCounts, dealinMoney, [{label:'自摸', count:totalSd}, {label:'臭連', count:draws}], '放槍');
  makeCard('🌟 自摸分佈', sdCounts, sdMoney, [{label:'胡牌', count:totalWin}, {label:'臭連', count:draws}], '自摸');
}

/* ============================================================
   即時計分引擎（對應 MahjongCount.py 的 execute_submit /
   generate_save_code / process_import_text，數值公式共用上面
   已經驗證過的 computeDeltas，不重新發明一套）
   ============================================================ */
function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

function initGameState(){
  return {
    startingChips: 0, baseScore: 30, taiScore: 10, mySeat: 0,
    roundIdx: 0, dealerIdx: 0, streak: 0, jiangCount: 0, isFinal: false, trackShanten: false,
    startTime: formatDateTimeNow(),
    names: ['東','南','西','北'],
    stats: {
      sd_me:{count:0, records:[], money:0}, win:{count:0, records:[], money:0},
      dealin:{count:0, records:[], money:0}, sd_other:{count:0, records:[], money:0},
    },
    pStats: [0,1,2,3].map(()=>({sd:0, win:0, dealin:0, sd_other:0, money:0})),
    shantenStats: {'0':0, '1':0, away:0, notready:0, tracked_rounds:0},
    tableStats: {total_rounds:0},
    undoStack: [],
    roundLog: [],
  };
}
function formatDateTimeNow(){
  const d = new Date(); const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function engineExecuteSubmit(state, form){
  const { undoStack: prevUndoStack, ...stateWithoutUndo } = state;
  const snapshot = deepClone(stateWithoutUndo);
  const s = deepClone(stateWithoutUndo);
  // 💡 把這次送出用的表單選擇（誰胡誰、台數、聽牌狀況）跟狀態快照一起存起來，
  //    這樣撤銷上一局時可以把原本選的按鈕都帶回來，只需要修正錯的欄位（例如台數打錯）。
  s.undoStack = [...(prevUndoStack||[]), {snapshot, form: deepClone(form)}];

  const currRoundIdx = s.roundIdx, currDealerIdx = s.dealerIdx, currStreak = s.streak, mySeat = s.mySeat;
  s.tableStats.total_rounds += 1;

  if (s.trackShanten){
    s.shantenStats.tracked_rounds = (s.shantenStats.tracked_rounds||0) + 1;
    if (form.shanten !== null && form.shanten !== undefined){
      s.shantenStats[String(form.shanten)] = (s.shantenStats[String(form.shanten)]||0) + 1;
    }
  }
  const shantenStr = (form.shanten !== null && form.shanten !== undefined) ? (SHANTEN_NAMES[String(form.shanten)]||'') : '';

  let logType, logW, logL, logTai;
  if (form.winner === 'draw'){ logType='draw'; logW=null; logL=null; logTai=0; }
  else if (form.type === 'tsumo'){ logType='tsumo'; logW=form.winner; logL=null; logTai=form.tai; }
  else { logType='ron'; logW=form.winner; logL=form.loser; logTai=form.tai; }

  const rec = {jiang:s.jiangCount, circle:currRoundIdx, dealer:currDealerIdx, streak:currStreak,
               type:logType, winner:logW, loser:logL, tai:logTai,
               shanten:(form.shanten!==null && form.shanten!==undefined) ? String(form.shanten) : null};

  const deltas = computeDeltas({type:logType==='draw'?TYPE_DRAW:(logType==='tsumo'?TYPE_TSUMO:TYPE_RON),
                                 winner:logW, loser:logL, tai:logTai, dealer:currDealerIdx, streak:currStreak},
                                s.baseScore, s.taiScore);

  if (logType === 'tsumo'){
    const w = logW;
    for (let l=0;l<4;l++){
      if (l===w) continue;
      const amt = -deltas[l];
      s.pStats[w].money += amt; s.pStats[l].money -= amt; s.pStats[l].sd_other += 1;
      if (l===mySeat){
        s.stats.sd_other.count += 1; s.stats.sd_other.money -= amt;
        s.stats.sd_other.records.push({tai:logTai, money:-amt, context:''});
      }
    }
    s.pStats[w].sd += 1;
    if (w===mySeat){
      s.stats.sd_me.count += 1; s.stats.sd_me.money += deltas[w];
      s.stats.sd_me.records.push({tai:logTai, money:deltas[w], context:''});
    }
  } else if (logType === 'ron'){
    const w=logW, l=logL, amt=deltas[w];
    s.pStats[w].money += amt; s.pStats[l].money -= amt;
    s.pStats[w].win += 1; s.pStats[l].dealin += 1;
    if (w===mySeat){
      s.stats.win.count += 1; s.stats.win.money += amt;
      s.stats.win.records.push({tai:logTai, money:amt, context:''});
    }
    if (l===mySeat){
      s.stats.dealin.count += 1; s.stats.dealin.money -= amt;
      s.stats.dealin.records.push({tai:logTai, money:-amt, context:shantenStr});
    }
  }

  s.roundLog.push(rec);

  let jiangFinished = false;
  if (form.winner==='draw' || form.winner===currDealerIdx){
    s.streak += 1;
  } else {
    s.streak = 0;
    s.dealerIdx = (currDealerIdx+1)%4;
    if (s.dealerIdx===0){
      s.roundIdx += 1;
      if (s.roundIdx===4){ s.roundIdx=0; s.jiangCount+=1; jiangFinished=true; }
    }
  }
  if (jiangFinished) s.isFinal = true;
  return {state: s, jiangFinished};
}

function engineUndo(state){
  if (!state.undoStack || state.undoStack.length===0) return {state, form:null};
  const stack = state.undoStack.slice(0,-1);
  const entry = state.undoStack[state.undoStack.length-1];
  // 相容舊格式：舊存檔的 undoStack 項目本身就是狀態快照（沒有 .snapshot 欄位），
  // 這種情況就沒有表單可以還原，form 給 null 即可。
  const hasFormWrapper = entry && typeof entry === 'object' && 'snapshot' in entry;
  const prev = deepClone(hasFormWrapper ? entry.snapshot : entry);
  prev.undoStack = stack;
  const restoredForm = hasFormWrapper ? deepClone(entry.form) : null;
  return {state: prev, form: restoredForm};
}

function buildSaveDataObject(state){
  const pStatsObj = {};
  state.pStats.forEach((p,i)=>{ pStatsObj[String(i)] = p; });
  return {
    v:3, start_time:state.startTime, chips:state.startingChips, base:state.baseScore, tai:state.taiScore,
    names:state.names, p_stats:pStatsObj, stats:state.stats, table_stats:state.tableStats,
    shanten_stats:state.shantenStats, history:[], round_log:state.roundLog, my_seat:state.mySeat,
    jiang:state.jiangCount, round:state.roundIdx, dealer:state.dealerIdx, streak:state.streak, track:state.trackShanten,
  };
}
function generateSaveCodeText(state){
  const jsonStr = JSON.stringify(buildSaveDataObject(state));
  const compressed = window.pako.deflate(jsonStr);
  let bin = '';
  compressed.forEach(b => bin += String.fromCharCode(b));
  const b64 = btoa(bin);
  return `[SaveCodeV2]${b64}[/SaveCodeV2]`;
}

// ---------- 存檔碼／戰報文字匯入（對應 process_import_text） ----------
function parseSaveCodeText(text){
  const m = text.match(/\[SaveCodeV2\]([\s\S]*?)\[\/SaveCodeV2\]/);
  if (!m) return null;
  const b64 = m[1].trim();
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const jsonStr = window.pako.inflate(bytes, {to:'string'});
  return JSON.parse(jsonStr);
}

function legacyRoundLogFromHistory(historyTuples, names, mySeat){
  const log = [];
  let currJiang=0, currCircle=0;
  const stripTags = s => s.replace(/<[^>]+>/g,'');
  historyTuples.forEach(([rIdx, line])=>{
    if (rIdx===-1){
      const m = line.match(/<b>(?:第(\d+)將\s*)?([東南西北])風圈<\/b>/);
      if (m){ if (m[1]) currJiang = parseInt(m[1],10)-1; currCircle = WINDS.indexOf(m[2]); }
      return;
    }
    const raw = stripTags(line);
    const dm = raw.match(/(?:👑|👤)(.*?)(?:上莊|風莊|莊)(?:\s*連(\d+))?/u);
    const streak = (dm && dm[2]) ? parseInt(dm[2],10) : 0;
    let dealerIdx = mySeat;
    if (dm && dm[1]){
      const dStr = dm[1].trim();
      const ni = names.indexOf(dStr), wi = WINDS.indexOf(dStr);
      if (ni>=0) dealerIdx = ni; else if (wi>=0) dealerIdx = wi;
    }
    const smSd = raw.match(/🌟\s*(.*?)(?:\(我\))?\s*自摸\s*(\d+)台/u);
    const smRon = raw.match(/(?:🀄.?|胡)\s*(.*?)(?:\(我\))?\s*胡\s*(.*?)(?:\(我\))?\s*(\d+)台/u);
    const rec = {jiang:currJiang, circle:currCircle, dealer:dealerIdx, streak, shanten:null};
    if (smSd){
      const wi = names.indexOf(smSd[1].trim());
      if (wi<0) return;
      rec.type='tsumo'; rec.winner=wi; rec.loser=null; rec.tai=parseInt(smSd[2],10);
    } else if (smRon){
      const wi = names.indexOf(smRon[1].trim()), li = names.indexOf(smRon[2].trim());
      if (wi<0 || li<0) return;
      rec.type='ron'; rec.winner=wi; rec.loser=li; rec.tai=parseInt(smRon[3],10);
    } else if (raw.includes('💨') || raw.includes('臭連')){
      rec.type='draw'; rec.winner='draw'; rec.loser=null; rec.tai=0;
    } else return;
    log.push(rec);
  });
  return log;
}

function importFromSaveCode(text){
  const saveData = parseSaveCodeText(text);
  if (!saveData) return null;
  const pStats = [0,1,2,3].map(i => saveData.p_stats[String(i)]);
  const roundLog = (saveData.round_log && saveData.round_log.length>=0 && Array.isArray(saveData.round_log))
    ? saveData.round_log
    : legacyRoundLogFromHistory(saveData.history||[], saveData.names, saveData.my_seat||0);
  return {
    names: saveData.names, pStats, stats: saveData.stats, tableStats: saveData.table_stats,
    shantenStats: saveData.shanten_stats, roundLog,
    chips: saveData.chips, base: saveData.base, tai: saveData.tai,
    jiang: saveData.jiang, round: saveData.round, dealer: saveData.dealer,
    streak: saveData.streak, track: saveData.track,
  };
}

function stripLeadingRankMark(s){ return s.replace(/^[🔥2️⃣3️⃣😭👤👑\s]+/, ''); }

function parseStatBlockText(text, statName){
  const headerRe = new RegExp(`(?:🌟|🀄.?|💸|💥)\\s*${statName}\\s*(\\d+)\\s*次\\s*([+-]?\\d+)\\s*元`, 'u');
  const m = text.match(headerRe);
  if (!m) return {count:0, money:0, records:[]};
  const count = parseInt(m[1],10), money = parseInt(m[2],10);
  const records = [];
  if (count>0){
    let inBlock=false;
    text.split('\n').forEach(line=>{
      if (headerRe.test(line)){ inBlock=true; return; }
      if (inBlock){
        if (line.trim().startsWith('└─')){
          const rm = line.match(/└─\s*(.*?)台\s*([+-]?\d+)\s*元\s*(.*)/u);
          if (rm) records.push({tai:parseInt(rm[1],10)||0, money:parseInt(rm[2],10)||0, context:(rm[3]||'').trim()});
        } else if (line.trim() && !line.includes('└─')){ inBlock=false; }
      }
    });
  }
  return {count, money, records};
}

// 即時狀態 → 戰報頁面的 DATA 格式（讓記分畫面跟戰報畫面共用同一套渲染程式碼）
// ============================================================
function buildLiveData(state){
  const typeMap = {ron:0, tsumo:1, draw:2};
  const rows = state.roundLog.map(rec => [
    rec.jiang, rec.circle, rec.dealer, rec.streak, typeMap[rec.type],
    rec.type==='draw' ? null : rec.winner, rec.loser, rec.tai, rec.shanten
  ]);

  const { points, series } = getProfitOverRoundsLocal(state.roundLog, state.baseScore, state.taiScore, state.startingChips);
  const isMultiJiang = points.some(p => p.jiang !== null && p.jiang > 0);
  const trendAll = {
    labels: buildTrendXLabelsLocal(points, !isMultiJiang, isMultiJiang ? 'jiang' : 'circle'),
    series,
  };
  const jiangValues = [...new Set(points.filter(p=>p.jiang!==null).map(p=>p.jiang))].sort((a,b)=>a-b);
  const trendByJiang = {};
  jiangValues.forEach(j=>{
    const idxs = []; points.forEach((p,i)=>{ if (p.jiang===j) idxs.push(i); });
    if (!idxs.length) return;
    const start = Math.max(0, idxs[0]-1), end = idxs[idxs.length-1]+1;
    const subPoints = points.slice(start, end);
    trendByJiang[String(j)] = {
      labels: buildTrendXLabelsLocal(subPoints, true, 'circle'),
      series: series.map(s => s.slice(start, end)),
    };
  });

  return {
    v:1, my: state.mySeat, chips: state.startingChips, base: state.baseScore, tai: state.taiScore,
    names: state.names, dealerNow: state.dealerIdx,
    p: state.pStats.map(p => [p.money, p.sd, p.win, p.dealin, p.sd_other]),
    final: state.isFinal, track: state.trackShanten,
    prog: buildProgressString(state), tr: state.tableStats.total_rounds, trimmed: false,
    r: rows, trendAll, trendByJiang,
  };
}

function getProfitOverRoundsLocal(roundLog, base, taiScore, chips){
  const profits = [0,0,0,0];
  const points = [{jiang:null, circle:null, is_start:true, profits:[0,0,0,0]}];
  let currentPhase = null;
  roundLog.forEach(rec=>{
    const phase = `${rec.jiang}-${rec.circle}-${rec.dealer}`;
    if (currentPhase!==null && phase!==currentPhase.key){
      points.push({jiang:currentPhase.jiang, circle:currentPhase.circle, is_start:false, profits:[...profits]});
    }
    currentPhase = {key:phase, jiang:rec.jiang, circle:rec.circle};
    const d = computeDeltas({type: rec.type==='draw'?TYPE_DRAW:(rec.type==='tsumo'?TYPE_TSUMO:TYPE_RON),
                              winner:rec.winner, loser:rec.loser, tai:rec.tai, dealer:rec.dealer, streak:rec.streak}, base, taiScore);
    for (let i=0;i<4;i++) profits[i]+=d[i];
  });
  if (currentPhase!==null) points.push({jiang:currentPhase.jiang, circle:currentPhase.circle, is_start:false, profits:[...profits]});
  const series = [0,1,2,3].map(i => points.map(p => chips + p.profits[i]));
  return {points, series};
}

function buildTrendXLabelsLocal(points, isSingleJiangView, mode){
  mode = mode || 'dense';
  if (mode==='dense'){
    const labels=[]; let lastCircle=null, pos=0;
    points.forEach((pt,idx)=>{
      if (pt.is_start || idx===0){ labels.push(pt.is_start?'開局':'將初'); lastCircle=pt.circle; pos=0; return; }
      if (pt.circle!==lastCircle){ pos=0; lastCircle=pt.circle; }
      labels.push(pos===0 ? `${WINDS[pt.circle]}風東` : WINDS[pos]); pos++;
    });
    return labels;
  }
  if (mode==='jiang'){
    const n=points.length;
    return points.map((pt,idx)=>{
      if (pt.is_start||idx===0) return pt.is_start?'開局':'將初';
      const isEnd = (idx===n-1) || (points[idx+1].jiang!==pt.jiang);
      return isEnd ? `第${pt.jiang+1}將` : '';
    });
  }
  const n=points.length;
  return points.map((pt,idx)=>{
    if (pt.is_start||idx===0) return pt.is_start?'開局':'將初';
    const isEnd = (idx===n-1) || (points[idx+1].circle!==pt.circle) || (points[idx+1].jiang!==pt.jiang);
    if (!isEnd) return '';
    if (!isSingleJiangView && pt.circle===0) return `第${pt.jiang+1}將${WINDS[pt.circle]}`;
    return WINDS[pt.circle];
  });
}

function buildProgressString(state){
  const j = state.jiangCount, r = state.roundIdx, d = state.dealerIdx;
  if (state.isFinal && r===0 && d===0 && state.streak===0 && j>0 && state.roundLog.length>0){
    return `第${j}將 結束`;
  }
  return `第${j+1}將 ${WINDS[r]}風${WINDS[d]}局`;
}

// 對應 Python 版 dealer_notice：誰上莊、連了幾莊
function buildDealerNoticeString(state){

function sanitizeNameJS(raw, seatIdx, namesArr){
  const div = document.createElement('div'); div.textContent = (raw||'').trim().slice(0,6);
  const name = div.innerHTML; // 借用瀏覽器原生轉義，等同 Python 的 html.escape
  if (!name) return {name:null, err:'名稱不可空白，請重新輸入'};
  for (let i=0;i<namesArr.length;i++){
    if (i!==seatIdx && namesArr[i]===name) return {name:null, err:`名稱「${name}」已經被其他玩家使用，請換一個`};
  }
  return {name, err:null};
}

function wizBack(){
  wiz.error = '';

  if (step === 'welcome') return;
  if (step === 'import_paste'){ wizGoto('welcome'); return; }
  if (step === 'chips'){ wizGoto('welcome'); return; }

  if (step === 'my_seat'){
    const name = wiz.windAssign[3];
    wiz.windAssign[3] = null;
    if (name) wiz.remainingNames.push(name);
    wizGoto('wind_3');
    return;
  }
  if (step.startsWith('wind_')){
    const idx = parseInt(step.split('_')[1], 10);
    if (idx === 0){

    const prevIdx = idx - 1;

    if (name) wiz.remainingNames.push(name);
    wizGoto(`wind_${prevIdx}`);
    return;

          <button class="wiz-btn${wiz.trackShanten ? '' : ' active'}" data-v="0">關閉</button>
        </div>
        <button class="wiz-secondary-btn" id="btn-shanten-back">⬅️ 上一步</button>
      </div>`;
    el.querySelectorAll('.wiz-btn').forEach(b => b.onclick = () => {
      wiz.trackShanten = b.dataset.v === '1';
      wizGoto('names');
    });
    document.getElementById('btn-shanten-back').onclick = wizBack;
    return;
  }

  if (wiz.step === 'names'){
    el.innerHTML = `
      <div class="wiz-step">
        <div class="wiz-label">先輸入四位玩家的名字（還不用管誰坐哪一家）</div>
        ${[0,1,2,3].map(i => `<input class="wiz-input" id="name-${i}" placeholder="玩家 ${i+1}" maxlength="6" value="${wiz.tempNames[i]||''}">`).join('')}
        ${errBox()}
        <div class="wiz-label" style="margin-top:10px;">快速選取常用玩家：</div>
        <div class="wiz-grid" style="grid-template-columns:repeat(3,1fr);">
          ${PRESET_NAMES.map(n => `<button type="button" class="wiz-btn preset-name-btn" data-name="${n}">${n}</button>`).join('')}
        </div>
        <button class="wiz-primary-btn" id="btn-names-next">下一步：抓位</button>
        <button class="wiz-secondary-btn" id="btn-names-back">⬅️ 上一步</button>
      </div>`;
    el.querySelectorAll('.preset-name-btn').forEach(btn => {
      btn.onclick = () => {
        const n = btn.dataset.name;
        for (let i=0;i<4;i++){
          const inp = document.getElementById(`name-${i}`);
          if (!inp.value.trim()){ inp.value = n; break; }
        }
      };
    });
    document.getElementById('btn-names-next').onclick = () => {
      const vals = [0,1,2,3].map(i => document.getElementById(`name-${i}`).value);
      const cleaned = [];
      for (let i=0;i<4;i++){
        const {name, err} = sanitizeNameJS(vals[i], i, cleaned);
        if (err){ wiz.tempNames = vals; wiz.error = `第 ${i+1} 位：${err}`; renderWizard(); return; }
        cleaned.push(name);
      }
      wiz.tempNames = cleaned;
      wiz.remainingNames = cleaned.slice();
      wiz.windAssign = [null,null,null,null];
      wizGoto('wind_0');
    };
    document.getElementById('btn-names-back').onclick = () => {
      wiz.tempNames = [0,1,2,3].map(i => document.getElementById(`name-${i}`).value);
      wizBack();
    };
    return;
  }

  if (wiz.step.startsWith('wind_')){
    const windIdx = parseInt(wiz.step.split('_')[1], 10);
    const windLabel = WINDS[windIdx];

    if (windIdx === 3 && wiz.remainingNames.length === 1){
      // 最後一位自動帶入，只需確認
      el.innerHTML = `
        <div class="wiz-step">
          <div class="wiz-label">最後一位自動歸為「${windLabel}」風位：</div>
          <div class="wiz-hint-card form-hint-card">${wiz.remainingNames[0]}</div>
          <button class="wiz-primary-btn" id="btn-confirm-last">確認</button>
          <button class="wiz-secondary-btn" id="btn-wind-back">⬅️ 上一步</button>
        </div>`;
      document.getElementById('btn-confirm-last').onclick = () => {
        wiz.windAssign[3] = wiz.remainingNames[0];
        wizGoto('my_seat');
      };
      document.getElementById('btn-wind-back').onclick = wizBack;
      return;
    }

    el.innerHTML = `
      <div class="wiz-step">
        <div class="wiz-label">${windLabel}風位是誰？</div>
        <div class="wiz-grid">
          ${wiz.remainingNames.map(n => `<button class="wiz-btn" data-n="${n}">${n}</button>`).join('')}
        </div>
        <button class="wiz-secondary-btn" id="btn-wind-back">⬅️ 上一步</button>
      </div>`;
    el.querySelectorAll('.wiz-btn').forEach(b => b.onclick = () => {
      const n = b.dataset.n;
      wiz.windAssign[windIdx] = n;
      wiz.remainingNames = wiz.remainingNames.filter(x => x !== n);
      wizGoto(windIdx < 3 ? `wind_${windIdx+1}` : 'my_seat');
    });
    document.getElementById('btn-wind-back').onclick = wizBack;
    return;
  }

  if (wiz.step === 'my_seat'){
    el.innerHTML = `
      <div class="wiz-step">
        <div class="wiz-label">你是哪一位？</div>
        <div class="wiz-grid">
          ${wiz.windAssign.map((n,i) => `<button class="wiz-btn" data-i="${i}">${WINDS[i]}：${n}</button>`).join('')}
        </div>
        <button class="wiz-secondary-btn" id="btn-myseat-back">⬅️ 上一步</button>
      </div>`;
    el.querySelectorAll('.wiz-btn').forEach(b => b.onclick = () => {
      finalizeSetup(parseInt(b.dataset.i,10));
    });
    document.getElementById('btn-myseat-back').onclick = wizBack;
    return;
  }
}

function finalizeSetup(mySeat){
  let state = initGameState();
  state.names = wiz.windAssign.slice();
  state.mySeat = mySeat;

  if (wiz.mode === 'new'){
    state.startingChips = wiz.chips;
    state.baseScore = wiz.base;
    state.taiScore = wiz.tai;
    state.trackShanten = wiz.trackShanten;
  } else {
    // 引繼匯入：把舊資料依照 windAssign（名字→新座位）重新對應
    const d = wiz.importedData;
    const nameToNewSeat = {};
    wiz.windAssign.forEach((name, newSeat) => { nameToNewSeat[name] = newSeat; });

    state.startingChips = 0;
    state.baseScore = d.base;
    state.taiScore = d.tai;
    state.trackShanten = !!d.track;
    state.jiangCount = d.jiang || 0;
    state.roundIdx = d.round || 0;
    state.dealerIdx = d.dealer || 0;
    state.streak = d.streak || 0;
    state.tableStats = d.tableStats || {total_rounds:0};
    state.shantenStats = d.shantenStats || state.shantenStats;

    if (wiz.importKind === 'save'){
      // pStats/roundLog 用的是「舊座位編號」，直接用 舊索引→名字→新座位 做轉換
      const oldIdxToNewSeat = {};
      d.names.forEach((name, oldIdx) => { oldIdxToNewSeat[oldIdx] = nameToNewSeat[name]; });
      const newPStats = [0,1,2,3].map(()=>({sd:0,win:0,dealin:0,sd_other:0,money:0}));
      d.pStats.forEach((p, oldIdx) => { newPStats[oldIdxToNewSeat[oldIdx]] = p; });
      state.pStats = newPStats;
      state.stats = d.stats;
      state.roundLog = d.roundLog.map(rec => ({
        ...rec,
        dealer: oldIdxToNewSeat[rec.dealer],
        winner: (rec.winner==='draw'||rec.winner===null) ? rec.winner : oldIdxToNewSeat[rec.winner],
        loser: rec.loser===null||rec.loser===undefined ? null : oldIdxToNewSeat[rec.loser],
      }));
    } else {
      // 純文字戰報：importData 是 [name, money, sd, win, dealin, sdOther]（舊局排序，不一定是座位順序）
      const newPStats = [0,1,2,3].map(()=>({sd:0,win:0,dealin:0,sd_other:0,money:0}));
      d.importData.forEach(row => {
        const newSeat = nameToNewSeat[row[0]];
        if (newSeat===undefined) return;
        newPStats[newSeat] = {
          money: parseInt(row[1],10) || 0, sd: parseInt(row[2],10)||0, win: parseInt(row[3],10)||0,
          dealin: parseInt(row[4],10)||0, sd_other: parseInt(row[5],10)||0,
        };
      });
      state.pStats = newPStats;
      state.stats = d.stats;
      state.roundLog = d.roundLog.map(rec => ({
        ...rec,
        dealer: nameToNewSeat[wiz.importedNames[rec.dealer]] ?? rec.dealer,
        winner: (rec.winner==='draw'||rec.winner===null) ? rec.winner : (nameToNewSeat[wiz.importedNames[rec.winner]] ?? rec.winner),
        loser: (rec.loser===null||rec.loser===undefined) ? null : (nameToNewSeat[wiz.importedNames[rec.loser]] ?? rec.loser),
      }));
    }
  }

  liveState = state;
  saveLiveState(liveState);
  showScoringApp();
}

function importFromPlainReport(text){
  let raw = [...text.matchAll(/\[(.*?)\] 💰 ([+-]?\d+)\s*元\n└\s*自摸\s*(\d+)\s*次[\s\S]*?胡牌\s*(\d+)\s*次[\s\S]*?放槍\s*(\d+)\s*次[\s\S]*?被摸\s*(\d+)\s*次/gu)];
  if (raw.length !== 4){
    raw = [...text.matchAll(/\[(.*?)\] 💰 ([+-]?\d+)\s*元/gu)];
    if (raw.length !== 4) return null;
  }
  const stakeM = text.match(/底台：(\d+)\/(\d+)/);
  const base = stakeM ? parseInt(stakeM[1],10) : 30;
  const tai = stakeM ? parseInt(stakeM[2],10) : 10;
  const cleanedPlayers = raw.map(p => [stripLeadingRankMark(p[1]).trim(), p[2], p[3], p[4], p[5], p[6]]);
  const names = cleanedPlayers.map(p => p[0]);

  let jiangCount=0, roundIdx=0, dealerIdx=0;
  const trM = text.match(/共打了 (\d+) 局/);
  const totalRounds = trM ? parseInt(trM[1],10) : 0;
  const progM = text.match(/進度：(?:第(\d+)將\s*)?(東|南|西|北)風([東南西北])局/);
  if (progM){
    if (progM[1]) jiangCount = parseInt(progM[1],10)-1;
    roundIdx = WINDS.indexOf(progM[2]); dealerIdx = WINDS.indexOf(progM[3]);
  } else if (text.includes('結束')){
    const endM = text.match(/第(\d+)將 結束/);
    if (endM){ jiangCount = parseInt(endM[1],10); roundIdx=0; dealerIdx=0; }
  }

  let roundLog = [], streak = 0;
  let histM = text.match(/明細：\s*([\s\S]*?)\s*━━━━━━━━━━━━━━━━━━/);
  if (!histM) histM = text.match(/明細：\s*([\s\S]*?)\s*🎯/);
  if (histM){
    const historyTuples = [];
    const validLines = histM[1].trim().split('\n').map(l=>l.trim()).filter(l=>l && !/^[━─┈]+$/.test(l));
    let currentRound = roundIdx;
    validLines.forEach(line=>{
      const circleM = line.match(/^(?:<[^>]+>)?(?:第(\d+)將\s*)?([東南西北])風圈/);
      if (circleM){
        currentRound = WINDS.indexOf(circleM[2]);
        historyTuples.push([-1, `<b>${line.replace(/<\/?b>/g,'')}</b>`]);
      } else historyTuples.push([currentRound, line]);
    });
    roundLog = legacyRoundLogFromHistory(historyTuples, names, 0);
    if (validLines.length>0){
      const lastLine = validLines[validLines.length-1];
      const sm = lastLine.match(/連(\d+)/);
      if (sm) streak = parseInt(sm[1],10);
      else { const nextM = text.match(/進入下一局：[\s\S]*?連莊\s*(\d+)/); streak = nextM ? parseInt(nextM[1],10) : 0; }
    }
  }

  let shantenStats = {'0':0,'1':0,away:0,notready:0,tracked_rounds:0};
  const shM = text.match(/聽牌(\d+)次(?:\(([\d.]+)%\))?/);
  if (shM){
    shantenStats['0'] = parseInt(shM[1],10);
    if (shM[2]){ const pct=parseFloat(shM[2]); shantenStats.tracked_rounds = pct>0 ? Math.round(shantenStats['0']/(pct/100)) : 0; }
  }
  const stats = {
    sd_me: parseStatBlockText(text,'自摸'), win: parseStatBlockText(text,'胡牌'),
    dealin: parseStatBlockText(text,'放槍'), sd_other: parseStatBlockText(text,'被摸'),
  };
  return {
    names, importData: cleanedPlayers, base, tai, chips:0,
    jiang: jiangCount, round: roundIdx, dealer: dealerIdx, streak,
    tableStats: {total_rounds: totalRounds}, shantenStats, stats, roundLog,
  };
}


// ============================================================
// 記分表單（即時模式）—— 三排同時顯示、順序不限、選滿自動送出，
// 版面配置沿用 Telegram Bot 已確認過的設計：「我」固定左下、皇冠標示、
// 逆時針排列（左上=上家、右上=對家、左下=我、右下=下家）。
// ============================================================
let liveState = null;
let liveForm = {winner:null, type:null, loser:null, tai:null, shanten:null};
let liveTaiPage = 0;

function showScoringApp(){
  document.getElementById('setup-wizard').style.display = 'none';
  document.getElementById('scoring-app').style.display = '';
  document.getElementById('live-title').textContent = '即時計分';
  liveForm = {winner:null, type:null, loser:null, tai:null, shanten:null};
  liveTaiPage = 0;
  renderLiveApp();
}

function liveFormNeedsShanten(){
  const f = liveForm, track = liveState.trackShanten;
  if (f.winner === 'draw') return track;
  if (f.winner === null) return false;
  if (f.winner === liveState.mySeat) return false;
  return track || f.loser === liveState.mySeat;
}
function liveFormMissing(){
  const f = liveForm; const missing = [];
  if (f.winner === null) missing.push('winner');
  if (f.winner !== 'draw'){
    if (f.type === null || (f.type==='ron' && f.loser===null)) missing.push('loser');
    if (f.tai === null) missing.push('tai');
  }
  if (liveFormNeedsShanten() && f.shanten === null) missing.push('shanten');
  return missing;
}

function trySubmitLiveForm(){
  if (liveFormMissing().length) { renderLiveApp(); return; }
  if (liveForm.shanten === null){
    liveForm.shanten = (liveForm.winner !== 'draw' && liveForm.winner === liveState.mySeat) ? '0' : null;
  }
  const isDraw = liveForm.winner === 'draw';
  const { state, jiangFinished } = engineExecuteSubmit(liveState, liveForm);
  liveState = state;
  liveForm = {winner:null, type:null, loser:null, tai:null, shanten:null};
  liveTaiPage = 0;
  saveLiveState(liveState);
  renderLiveApp();
  showToast(isDraw ? '💨 已記錄臭連' : '✅ 已記錄本局結果');
  if (jiangFinished) showSaveCodePanel('🏁 這將結束了！自動產生存檔碼：');
}

function renderLiveApp(){
  refreshReportFromData(buildLiveData(liveState));
  document.getElementById('live-progress').textContent = buildProgressString(liveState) +
    (liveState.isFinal ? '（已結算）' : '');
  renderLivePlayers();
  if (liveState.isFinal){
    renderFinalPanel();
  } else {
    renderLiveForm();
  }
}

function renderLivePlayers(){
  const wrap = document.getElementById('live-players');
  wrap.innerHTML = '';
  const order = [0,1,2,3].slice().sort((a,b)=> liveState.pStats[b].money - liveState.pStats[a].money);
  order.forEach((seat, rank) => {
    const p = liveState.pStats[seat];
    const money = liveState.startingChips + p.money;
    const div = document.createElement('div');
    div.className = 'p-card';
    div.style.setProperty('--accent', suitColor(seat));
    div.innerHTML = `
      <div class="p-tile">${WINDS[seat]}</div>
      <div class="p-name">${liveState.names[seat]}${seat===liveState.mySeat? '<span class="me-mark">（我）</span>':''}</div>
      <div class="p-rank">${['🥇 第1名','🥈 第2名','🥉 第3名','😭 第4名'][rank]}${seat===liveState.dealerIdx? '・莊':''}</div>
      <div class="p-money num" style="color:${suitColor(seat)}">${fmtSigned(money)}</div>
      <div class="p-sub">自摸${p.sd} 胡${p.win} 放槍${p.dealin} 被摸${p.sd_other}</div>
    `;
    wrap.appendChild(div);
  });
}

function playerLabelLive(i, selected, disabledReason){
  const my = liveState.mySeat;
  const relName = i===my ? '我' : (['','下家','對家','上家'][(i-my+4)%4]);
  const dealerStr = i===liveState.dealerIdx ? '莊' : '';
  const base = `${relName}(${liveState.names[i]}${dealerStr})`.trim();
  if (disabledReason) return `🚫 ${base}`;
  let mark;
  if (selected) mark = '✅';
  else if (i===my) mark = '👑';
  else mark = ['🀀','🀁','🀂','🀃'][i];
  return `${mark} ${base}`;
}

function renderLiveForm(){
  const el = document.getElementById('live-form-wrap');
  const f = liveForm, missing = liveFormMissing();
  const my = liveState.mySeat;
  const shimo=(my+1)%4, toi=(my+2)%4, kami=(my+3)%4;
  const order = [kami, toi, my, shimo];

  let html = '';

  html += `<div class="form-round-info">🀄 【${buildProgressString(liveState)}】${buildDealerNoticeString(liveState)}</div>`;

  const parts = [];
  if (f.winner==='draw') parts.push('💨 臭連');
  else if (f.winner!==null) parts.push(`🀄 ${playerLabelLive(f.winner,false).split(' ').slice(1).join(' ')} 胡`);
  if (f.type==='tsumo') parts.push('🌟 自摸');
  else if (f.type==='ron' && f.loser!==null) parts.push(`👉 ${liveState.names[f.loser]} 放槍`);
  if (f.tai!==null) parts.push(`${f.tai}台`);
  if (f.shanten!==null) parts.push(SHANTEN_NAMES[String(f.shanten)]||'');
  html += `<div class="form-hint-card">${parts.length ? '📝 目前選擇：<b>'+parts.join('　')+'</b>' : '📝 請直接點選（順序不限，選滿自動記錄）'}</div>`;

  html += `<div class="form-section-title">① 誰胡牌${missing.includes('winner')?'':' ✅'}</div>`;
  html += `<div class="form-grid2">` + order.map(i =>
    `<button class="form-pbtn ${f.winner===i?'selected':''}" data-act="w" data-i="${i}">${playerLabelLive(i, f.winner===i)}</button>`
  ).join('') + `</div>`;
  html += `<button class="form-wide-btn ${f.winner==='draw'?'selected':''}" data-act="w" data-i="draw">💨 臭連（流局）</button>`;

  if (f.winner !== 'draw'){
    html += `<div class="form-section-title">② 誰放槍／自摸${missing.includes('loser')?'':' ✅'}</div>`;
    html += `<div class="form-grid2">` + order.map(i => {
      if (f.winner!==null && i===f.winner) return `<button class="form-pbtn disabled" disabled>${playerLabelLive(i,false,'已胡')}</button>`;
      const sel = f.type==='ron' && f.loser===i;
      return `<button class="form-pbtn ${sel?'selected':''}" data-act="l" data-i="${i}">${playerLabelLive(i, sel)}</button>`;
    }).join('') + `</div>`;
    html += `<button class="form-wide-btn ${f.type==='tsumo'?'selected':''}" data-act="l" data-i="tsumo">🌟 這是自摸！</button>`;

    html += `<div class="form-section-title">③ 幾台${f.tai===null?'':` ✅ 目前：${f.tai}台`}</div>`;
    const lo = liveTaiPage===0 ? 0 : 11, hi = liveTaiPage===0 ? 11 : 21;
    const nums = []; for (let n=lo;n<hi;n++) nums.push(n);
    html += `<div class="form-tai-grid">` + nums.map(n =>
      `<button class="form-tai-btn ${f.tai===n?'selected':''}" data-act="tai" data-i="${n}">${n}</button>`
    ).join('') + `</div>`;
    html += `<div class="form-sys-row">
      <button data-act="taipage" data-i="${liveTaiPage===0?1:0}">${liveTaiPage===0?'11～20 台 ▸':'◂ 0～10 台'}</button>
      <button data-act="taimanual">✏️ 手動輸入</button>
    </div>`;
  }

  if (liveFormNeedsShanten()){
    html += `<div class="form-section-title">④ 你的聽牌狀況${f.shanten===null?'':' ✅'}</div>`;
    const opts = (f.loser===liveState.mySeat) ? [['0','🎯 聽牌'],['1','⚡ 1進聽'],['away','💨 走遠了']] : [['0','🎯 聽牌'],['notready','💤 沒聽牌']];
    html += `<div class="form-grid2">` + opts.map(([k,label]) =>
      `<button class="form-pbtn ${f.shanten===k?'selected':''}" data-act="shanten" data-i="${k}">${label}</button>`
    ).join('') + `</div>`;
  }

  html += `<div class="form-sys-row">
    <button data-act="clear">🧹 清除重選</button>
    <button data-act="undo" ${liveState.undoStack.length? '' : 'disabled'}>${liveState.undoStack.length?'⬅️ 撤銷上一局':'🚫 無法撤銷'}</button>
  </div>
  <div class="form-sys-row">
    <button data-act="finalize">🛑 提前結算</button>
  </div>`;

  el.innerHTML = html;
  el.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', () => handleLiveFormAction(btn.dataset.act, btn.dataset.i)));
}

function handleLiveFormAction(act, i){
  if (act === 'w'){
    if (i === 'draw'){
      liveForm = {winner:'draw', type:null, loser:null, tai:null, shanten:null};
    } else {
      const newW = parseInt(i,10);
      liveForm.winner = newW;
      if (liveForm.loser === newW){ liveForm.loser=null; liveForm.type=null; }
      liveForm.shanten = null;
    }
    trySubmitLiveForm();
  } else if (act === 'l'){
    if (i === 'tsumo'){ liveForm.type='tsumo'; liveForm.loser=null; }
    else {
      const l = parseInt(i,10);
      if (liveForm.winner === l){ alert('胡牌者不能同時是放槍者'); return; }
      liveForm.type='ron'; liveForm.loser=l;
    }
    liveForm.shanten = null;
    trySubmitLiveForm();
  } else if (act === 'tai'){
    liveForm.tai = parseInt(i,10);
    trySubmitLiveForm();
  } else if (act === 'shanten'){
    liveForm.shanten = i;
    trySubmitLiveForm();
  } else if (act === 'taipage'){
    liveTaiPage = parseInt(i,10);
    renderLiveForm();
  } else if (act === 'taimanual'){
    const v = prompt('請輸入台數（0～999 的整數）：');
    if (v===null) return;
    const n = parseInt(v,10);
    if (isNaN(n) || n<0 || n>999){ alert('請輸入 0～999 的整數'); return; }
    liveForm.tai = n;
    trySubmitLiveForm();
  } else if (act === 'clear'){
    liveForm = {winner:null, type:null, loser:null, tai:null, shanten:null};
    renderLiveForm();
  } else if (act === 'undo'){
    const result = engineUndo(liveState);
    liveState = result.state;
    liveForm = result.form ? deepClone(result.form) : {winner:null, type:null, loser:null, tai:null, shanten:null};
    liveTaiPage = 0;
    saveLiveState(liveState);
    renderLiveApp();
  } else if (act === 'finalize'){
    if (confirm('確定要提前結算嗎？結算後可以在下方撤銷回到牌局。')){
      liveState.isFinal = true;
      saveLiveState(liveState);
      renderLiveApp();
      showSaveCodePanel('🛑 已提前結算，存檔碼：');
    }
  }
}

function renderFinalPanel(){
  const el = document.getElementById('live-form-wrap');
  el.innerHTML = `
    <div class="form-hint-card">🏁 本局已結算。</div>
    <div class="form-sys-row">
      <button data-act="undo-final">↩️ 撤銷結算（回到牌局）</button>
    </div>
    <div class="form-sys-row">
      <button data-act="show-savecode">💾 顯示存檔碼</button>
      <button data-act="new-game">🆕 開始新局</button>
    </div>
    <div id="savecode-panel"></div>`;
  el.querySelector('[data-act="undo-final"]').onclick = () => {
    liveState.isFinal = false; saveLiveState(liveState); renderLiveApp();
  };
  el.querySelector('[data-act="show-savecode"]').onclick = () => showSaveCodePanel('💾 存檔碼：');
  el.querySelector('[data-act="new-game"]').onclick = () => {
    if (confirm('確定要開始新的一局嗎？目前這局的存檔碼記得先保存喔。')){
      clearLiveState();
      wiz = {step:'welcome', mode:'new', tempNames:['','','',''], importedNames:[], importedData:null,
             importKind:null, windAssign:[null,null,null,null], remainingNames:[], chips:0, base:100, tai:20,
             trackShanten:false, error:''};
      document.getElementById('setup-wizard').style.display = '';
      document.getElementById('scoring-app').style.display = 'none';
      renderWizard();
    }
  };
}

function showSaveCodePanel(title){
  const code = generateSaveCodeText(liveState);
  let panel = document.getElementById('savecode-panel');
  if (!panel){
    panel = document.createElement('div');
    panel.id = 'savecode-panel';
    document.getElementById('live-form-wrap').appendChild(panel);
  }
  panel.innerHTML = `
    <div class="form-hint-card">
      ${title}
      <div class="savecode-box">${code}</div>
      <button class="wiz-primary-btn" id="btn-send-bot">📤 傳回 Telegram 聊天室</button>
      <button class="wiz-secondary-btn" id="btn-copy-code">📋 複製存檔碼</button>
    </div>`;
  document.getElementById('btn-send-bot').onclick = () => {
    if (tg && tg.sendData){
      try { tg.sendData(code); }
      catch(e){ alert('無法傳回聊天室，請改用「複製存檔碼」手動貼上。'); }
    } else {
      alert('目前無法直接傳回聊天室，請改用「複製存檔碼」手動貼上。');
    }
  };
  document.getElementById('btn-copy-code').onclick = () => {
    navigator.clipboard?.writeText(code).then(()=>alert('已複製存檔碼！')).catch(()=>alert('複製失敗，請手動選取文字複製。'));
  };
}

document.querySelectorAll('#live-tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#live-tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const isScore = btn.dataset.liveTab === 'score';
    document.getElementById('live-score-panel').style.display = isScore ? '' : 'none';
    document.getElementById('live-report-panel').style.display = isScore ? 'none' : '';
  });
});

function initLiveMode(){
  document.getElementById('report-view').style.display = 'none';
  document.getElementById('live-view').style.display = '';
  const reportView = document.getElementById('report-view');
  document.getElementById('live-report-panel').appendChild(reportView);
  reportView.style.display = '';

  const saved = loadLiveState();
  if (saved){
    liveState = saved;
    document.getElementById('setup-wizard').style.display = 'none';
    document.getElementById('scoring-app').style.display = '';
    liveForm = {winner:null, type:null, loser:null, tai:null, shanten:null};
    renderLiveApp();
  } else {
    renderWizard();
  }
}

if (DATA) {
  renderAll();
} else {
  initLiveMode();
}
</script>
</body>
</html>
